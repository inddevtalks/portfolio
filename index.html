    <script>
      // Apply the theme before first paint so there is no flash of the
      // wrong colours. Dark is the designed default; the toggle in the
      // nav persists a choice to localStorage.
      (function () {
        try {
          var theme = localStorage.getItem('pk-theme-v1') || 'dark'
          document.documentElement.classList.toggle('light', theme === 'light')
          document.documentElement.classList.toggle('dark', theme !== 'light')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
